[package]
name = "altair-ebpf"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
aya = { workspace = true }
aya-log = { workspace = true }
altair-ebpf-common = { path = "../altair-ebpf-common", features = ["user"] }
anyhow = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "signal"] }
bytemuck = "1"

[build-dependencies]
anyhow = { workspace = true }
aya-build = { workspace = true }
cargo_metadata = { workspace = true }

[[bin]]
name = "altair-ebpf"
path = "src/main.rs"
